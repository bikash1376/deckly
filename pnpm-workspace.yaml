packages:
  - "apps/*"
  - "packages/*"

# One zod for the whole workspace. @retenit/shared exports schemas that both the
# app and the Worker import, and zod instances do not interoperate across major
# versions: a schema built by zod 3 fails an instanceof check inside zod 4.
# The AI SDK accepts ^3.25.76, so v3 satisfies every consumer.
overrides:
  zod: "^3.25.76"

# pnpm 11 requires an explicit decision on every package with an install script,
# and exits non-zero until it gets one. Expo's CLI treats that exit code as a
# failed install, which is what broke `eas build`.
#
# True only where the script actually produces something we use: esbuild and
# workerd fetch platform binaries that wrangler and drizzle-kit run. The rest
# are funding notices or optional native addons with working JS fallbacks.
allowBuilds:
  esbuild: true
  workerd: true
  "@clerk/shared": false
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  utf-8-validate: false
