packages:
  - "apps/*"
  - "packages/*"

# One zod for the whole workspace. @deckly/shared exports schemas that both the
# app and the Worker import, and zod instances do not interoperate across major
# versions: a schema built by zod 3 fails an instanceof check inside zod 4.
# The AI SDK accepts ^3.25.76, so v3 satisfies every consumer.
overrides:
  zod: "^3.25.76"

onlyBuiltDependencies:
  - "@clerk/shared"
  - core-js
  - esbuild
  - workerd

allowBuilds:
  esbuild: set this to true or false
  workerd: set this to true or false
